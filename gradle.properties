android.nonTransitiveRClass=false

# SY --> 本机已手动装好 platform 37.1 / build-tools 37.0.0，禁止 AGP 再去
# dl.google.com 自动下载（那条链路只有 ~130KB/s，且会重复装出 android-37.1-2）。
android.builder.sdkDownload=false
# SY <--

kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# SY --> 依赖下载走本机代理时偶发 stall，默认超时（30s）太短会直接判死整个构建，
# 这里放宽到 3 分钟并允许重试。
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=500
# SY <--
